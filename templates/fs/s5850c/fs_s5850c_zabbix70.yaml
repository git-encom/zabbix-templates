      filter:
        evaltype: AND
        conditions:
        - macro: '{#PARTNUMBER}'
          value: \S
          operator: MATCHES_REGEX
          formulaid: A
      description: Only rows with non-empty part numbers. Numeric diagnostics require a single finite number. Multi-lane values remain in raw
        text items. Optical alarm control defaults to 0.
      trigger_prototypes:
      - uuid: 184d884b96b343418fa29a66da0d2ebd
        name: 'FS S5850C: Optic {#IFNAME}: Temperature above alarm threshold'
        expression: '{$FS.OPTICS.CONTROL:"{#IFNAME}"}=1 and last(/FS S5850C by SNMP/fs.optics.status[{#SNMPINDEX}])="active" and count(/FS S5850C
          by SNMP/fs.optics.temperature[{#SNMPINDEX}],3m)>0 and count(/FS S5850C by SNMP/fs.optics.temperature.alarm.high[{#SNMPINDEX}],3m)>0
          and (min(/FS S5850C by SNMP/fs.optics.temperature[{#SNMPINDEX}],3m)>last(/FS S5850C by SNMP/fs.optics.temperature.alarm.high[{#SNMPINDEX}]))'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        description: Opt-in per interface. Uses module alarm limits. Dark/unused optics can legitimately have low RX power. Multi-channel DOM
          requires a separate validated implementation.
      - uuid: 85cdeec7a84147f6bc84d63b829e40df
        name: 'FS S5850C: Optic {#IFNAME}: Temperature below alarm threshold'
        expression: '{$FS.OPTICS.CONTROL:"{#IFNAME}"}=1 and last(/FS S5850C by SNMP/fs.optics.status[{#SNMPINDEX}])="active" and count(/FS S5850C
          by SNMP/fs.optics.temperature[{#SNMPINDEX}],3m)>0 and count(/FS S5850C by SNMP/fs.optics.temperature.alarm.low[{#SNMPINDEX}],3m)>0 and
          (max(/FS S5850C by SNMP/fs.optics.temperature[{#SNMPINDEX}],3m)<last(/FS S5850C by SNMP/fs.optics.temperature.alarm.low[{#SNMPINDEX}]))'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        description: Opt-in per interface. Uses module alarm limits. Dark/unused optics can legitimately have low RX power. Multi-channel DOM
          requires a separate validated implementation.
      - uuid: 02e849cb4d274da2b20a21184d507ec9
        name: 'FS S5850C: Optic {#IFNAME}: Supply voltage above alarm threshold'
        expression: '{$FS.OPTICS.CONTROL:"{#IFNAME}"}=1 and last(/FS S5850C by SNMP/fs.optics.status[{#SNMPINDEX}])="active" and count(/FS S5850C
          by SNMP/fs.optics.voltage[{#SNMPINDEX}],3m)>0 and count(/FS S5850C by SNMP/fs.optics.voltage.alarm.high[{#SNMPINDEX}],3m)>0 and (min(/FS
          S5850C by SNMP/fs.optics.voltage[{#SNMPINDEX}],3m)>last(/FS S5850C by SNMP/fs.optics.voltage.alarm.high[{#SNMPINDEX}]))'
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        description: Opt-in per interface. Uses module alarm limits. Dark/unused optics can legitimately have low RX power. Multi-channel DOM
          requires a separate validated implementation.
      - uuid: b85117bb550244e393f666497d2cf51d
