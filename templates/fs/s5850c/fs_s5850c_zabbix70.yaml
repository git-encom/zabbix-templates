zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 99264f91e6c1415fb70f8e0e3e9de744
    template: FS S5850C by SNMP
    name: FS S5850C by SNMP
    description: Standalone Zabbix 7.0 template for FS S5850C-24S2C, firmware 3.3.1.2.2, sysObjectID 1.3.6.1.4.1.52642.1.99.21252. OIDs and conversions
      checked against supplied SNMP walks and SWITCH MIB. Live import/polling not yet verified. SNMPv2c community is configured on the host SNMP
      interface. Optional IF-MIB status/error discovery is disabled until its OIDs are verified. Optical thresholds are opt-in. QSFP multi-value
      readings are retained as raw text and are not converted to a single channel. No external scripts or linked templates required. See README-hu.md.
    vendor:
      name: Custom
      version: 1.0.0
    groups:
    - name: Templates/Network devices
    items:
    - uuid: ab1336375450459e8405500f56f18249
      name: System description
      type: SNMP_AGENT
      key: fs.system.description
      delay: 1h
      history: 14d
      trends: '0'
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      value_type: TEXT
    - uuid: c3cab22f81ee466e8e2047d6f6bce2b4
      name: System object ID
      type: SNMP_AGENT
      key: fs.system.objectid
      delay: 1h
      history: 14d
      trends: '0'
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      value_type: CHAR
    - uuid: 2459fa4b2ae24ab9bf1f8b134496780b
      name: Firmware version
      type: SNMP_AGENT
      key: fs.firmware
      delay: 1h
      history: 14d
      trends: '0'
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.10.1]
      value_type: CHAR
    - uuid: 79c60f7584964e52851b6514cb924c88
      name: Hardware serial number
      type: SNMP_AGENT
      key: fs.serial
      delay: 1h
      history: 14d
      trends: '0'
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.11.1]
      value_type: CHAR
    - uuid: 7deed7a2acfd4fed9b7b7d2297d203a1
      name: Hardware model
      type: SNMP_AGENT
      key: fs.model
      delay: 1h
      history: 14d
      trends: '0'
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.13.1]
      value_type: CHAR
    - uuid: 06085504f24e48fcad9ba62a0ed496e2
      name: System uptime (vendor TimeTicks)
      type: SNMP_AGENT
      key: fs.uptime
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: system
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.3.10.0]
      units: uptime
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      description: TimeTicks / 100. Counter wraps after about 497 days. A decrease can also indicate agent restart.
      triggers:
      - uuid: 79f03c77ef904d768dd9b6294badaa07
        name: 'FS S5850C: Uptime reset (possible restart)'
        expression: change(/FS S5850C by SNMP/fs.uptime)<0 and last(/FS S5850C by SNMP/fs.uptime)<600 and last(/FS S5850C by SNMP/fs.uptime,#2)<42948772
        priority: INFO
        tags:
        - tag: scope
          value: performance
        description: 'Heuristic: excludes the last 15 minutes before TimeTicks wrap. An agent restart can also reset uptime; this is not proof
          of a chassis reboot.'
    - uuid: f99a589d91d54afc8e4c492d2290f5e2
      name: CPU utilization (5 seconds)
      type: SNMP_AGENT
      key: fs.cpu.util[1]
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: cpu
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.9.1.0]
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s = value.replace(/^\s+|\s+$/g, ''); if (!/^[0-9]+(?:\.[0-9]+)?%$/.test(s)) { throw 'Expected a percentage'; } var n = Number(s.slice(0,-1));
          if (n < 0 || n > 100) { throw 'Percentage outside 0..100'; } return n;
    - uuid: c1e258cbe60e4d0e919eee096512b294
      name: CPU utilization (1 minute)
      type: SNMP_AGENT
      key: fs.cpu.util[2]
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: cpu
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.9.2.0]
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s = value.replace(/^\s+|\s+$/g, ''); if (!/^[0-9]+(?:\.[0-9]+)?%$/.test(s)) { throw 'Expected a percentage'; } var n = Number(s.slice(0,-1));
          if (n < 0 || n > 100) { throw 'Percentage outside 0..100'; } return n;
      triggers:
      - uuid: 92a4628a9fb84d18906885c6cfc84f8b
        name: 'FS S5850C: High CPU utilization'
        expression: min(/FS S5850C by SNMP/fs.cpu.util[2],5m)>{$FS.CPU.WARN}
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/FS S5850C by SNMP/fs.cpu.util[2],5m)<{$FS.CPU.WARN}-5
    - uuid: f0087abf36694a4fbcdac45aaf3d880f
      name: CPU utilization (5 minutes)
      type: SNMP_AGENT
      key: fs.cpu.util[3]
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: cpu
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.9.3.0]
      value_type: FLOAT
      units: '%'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - var s = value.replace(/^\s+|\s+$/g, ''); if (!/^[0-9]+(?:\.[0-9]+)?%$/.test(s)) { throw 'Expected a percentage'; } var n = Number(s.slice(0,-1));
          if (n < 0 || n > 100) { throw 'Percentage outside 0..100'; } return n;
    - uuid: c12c191ee59a4fa78cda3d7b313d98cf
      name: Reported memory total
      type: SNMP_AGENT
      key: fs.memory.total
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: memory
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.1.5.0]
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      description: SWITCH MIB reports kB; converted with multiplier 1024. Free/used counters may include virtual memory according to the MIB.
    - uuid: 22830abcae1349009da5f23ed0e93dad
      name: Reported memory free
      type: SNMP_AGENT
      key: fs.memory.free
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: memory
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.1.11.0]
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      description: SWITCH MIB reports kB; converted with multiplier 1024. Free/used counters may include virtual memory according to the MIB.
    - uuid: 205bbe41b9414a0a907af2f1af853e57
      name: Reported memory used
      type: SNMP_AGENT
      key: fs.memory.used
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: memory
      snmp_oid: get[1.3.6.1.4.1.52642.1.1.1.12.0]
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      description: SWITCH MIB reports kB; converted with multiplier 1024. Free/used counters may include virtual memory according to the MIB.
    - uuid: a482f17fe2c44b409413876eb5d32aa6
      name: Reported memory utilization
      type: CALCULATED
      key: fs.memory.util
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: memory
      value_type: FLOAT
      units: '%'
      params: 100*last(//fs.memory.used)/last(//fs.memory.total)
      triggers:
      - uuid: d7561f934e33471da8fc95cd67b9d36c
        name: 'FS S5850C: High reported memory utilization'
        expression: min(/FS S5850C by SNMP/fs.memory.util,5m)>{$FS.MEMORY.WARN}
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: max(/FS S5850C by SNMP/fs.memory.util,5m)<{$FS.MEMORY.WARN}-5
    - uuid: 958397c3295a4fffa72b6503045105d9
      name: SNMP availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      delay: 1m
      history: 14d
      trends: 365d
      tags:
      - tag: component
        value: health
      valuemap:
        name: SNMP availability
      triggers:
      - uuid: e717db30e81e42a5a5c5a7584f47c514
        name: 'FS S5850C: SNMP unavailable'
        expression: max(/FS S5850C by SNMP/zabbix[host,snmp,available],{$FS.SNMP.TIMEOUT})=0
        priority: HIGH
        tags:
        - tag: scope
          value: availability
    - uuid: f30c514786954eb48ffa427770decb83
      name: 'Interface counters: SNMP walk'
      type: SNMP_AGENT
      key: fs.if.walk
      delay: 1m
      history: '0'
      trends: '0'
      tags:
      - tag: component
        value: interface
      value_type: TEXT
      snmp_oid: walk[1.3.6.1.2.1.31.1.1.1.6,1.3.6.1.2.1.31.1.1.1.10,1.3.6.1.2.1.31.1.1.1.15]
    - uuid: 11a89eab95574ef6814be1f8f03775fd
      name: 'Optical diagnostics: SNMP walk'
      type: SNMP_AGENT
      key: fs.optics.walk
      delay: 1m
      history: '0'
      trends: '0'
      tags:
      - tag: component
        value: optics
      value_type: TEXT
      snmp_oid: walk[1.3.6.1.4.1.52642.1.37.1.10]
    discovery_rules:
    - uuid: f3cc59f8f42d4b488da6df007a2b1df4
      name: Physical interface discovery
      type: SNMP_AGENT
      key: fs.if.discovery
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      item_prototypes:
      - uuid: b534db3e56374b299f1e074abe1c7385
        name: 'Interface {#IFNAME} ({#IFALIAS}): Incoming traffic'
        type: DEPENDENT
        key: fs.if.in[{#SNMPINDEX}]
        delay: '0'
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        units: bps
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
          - '0'
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: fs.if.walk
        description: Native Counter64 rate conversion; no JavaScript numeric cast. Counter decreases are discarded by CHANGE_PER_SECOND.
      - uuid: 93a279f791604d6ea8e366e5a9ddc969
        name: 'Interface {#IFNAME} ({#IFALIAS}): Outgoing traffic'
        type: DEPENDENT
        key: fs.if.out[{#SNMPINDEX}]
        delay: '0'
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        units: bps
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
          - '0'
          error_handler: DISCARD_VALUE
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        master_item:
          key: fs.if.walk
        description: Native Counter64 rate conversion; no JavaScript numeric cast. Counter decreases are discarded by CHANGE_PER_SECOND.
      - uuid: f7b09f62a8b94c409e6f8d393e732cdc
        name: 'Interface {#IFNAME}: Reported speed'
        type: DEPENDENT
        key: fs.if.speed[{#SNMPINDEX}]
        delay: '0'
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        units: bps
        preprocessing:
        - type: SNMP_WALK_VALUE
          parameters:
          - 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
          - '0'
          error_handler: DISCARD_VALUE
        - type: MULTIPLIER
          parameters:
          - '1000000'
        master_item:
          key: fs.if.walk
        description: ifHighSpeed is in Mbps. This is the reported speed, not a hard-coded port maximum; down ports may report a nominal speed.
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$FS.IF.NAME.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#IFNAME}'
          value: '{$FS.IF.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      trigger_prototypes:
      - uuid: 0ea4e40067164b77baa2b38b182f9350
        name: 'FS S5850C: Interface {#IFNAME}: High bandwidth utilization'
        expression: last(/FS S5850C by SNMP/fs.if.speed[{#SNMPINDEX}])>0 and (avg(/FS S5850C by SNMP/fs.if.in[{#SNMPINDEX}],5m)>last(/FS S5850C
          by SNMP/fs.if.speed[{#SNMPINDEX}])*{$FS.IF.UTIL.WARN}/100 or avg(/FS S5850C by SNMP/fs.if.out[{#SNMPINDEX}],5m)>last(/FS S5850C by SNMP/fs.if.speed[{#SNMPINDEX}])*{$FS.IF.UTIL.WARN}/100)
        priority: WARNING
        tags:
        - tag: scope
          value: performance
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/FS S5850C by SNMP/fs.if.speed[{#SNMPINDEX}])=0 or (avg(/FS S5850C by SNMP/fs.if.in[{#SNMPINDEX}],5m)<last(/FS
          S5850C by SNMP/fs.if.speed[{#SNMPINDEX}])*({$FS.IF.UTIL.WARN}-5)/100 and avg(/FS S5850C by SNMP/fs.if.out[{#SNMPINDEX}],5m)<last(/FS
          S5850C by SNMP/fs.if.speed[{#SNMPINDEX}])*({$FS.IF.UTIL.WARN}-5)/100)
      graph_prototypes:
      - uuid: 4597ff43ad19484cadbb589b85b10111
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - sortorder: '0'
          color: 199C0D
          item:
            host: FS S5850C by SNMP
            key: fs.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: F63100
          item:
            host: FS S5850C by SNMP
            key: fs.if.out[{#SNMPINDEX}]
    - uuid: a511d91e07f94369b11eea28547e8d19
      name: Optional IF-MIB status/errors discovery (verify then enable)
      type: SNMP_AGENT
      key: fs.if.extended.discovery
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      item_prototypes:
      - uuid: b8939fc5ab794a36a9fc2331af4a0600
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        key: fs.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}]
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
        valuemap:
          name: IF admin status
      - uuid: 34e96873fe704f079b6de240c0669cf1
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        key: fs.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
        valuemap:
          name: IF oper status
        trigger_prototypes:
        - uuid: 8fa4614541f942e48691dc896b55629b
          name: 'FS S5850C: Interface {#IFNAME}: Link down'
          expression: '{$FS.IF.CONTROL:"{#IFNAME}"}=1 and last(/FS S5850C by SNMP/fs.if.admin[{#SNMPINDEX}])=1 and min(/FS S5850C by SNMP/fs.if.oper[{#SNMPINDEX}],3m)=2
            and max(/FS S5850C by SNMP/fs.if.oper[{#SNMPINDEX}],3m)=2'
          priority: AVERAGE
          tags:
          - tag: scope
            value: performance
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: '{$FS.IF.CONTROL:"{#IFNAME}"}=0 or last(/FS S5850C by SNMP/fs.if.admin[{#SNMPINDEX}])<>1 or last(/FS S5850C by
            SNMP/fs.if.oper[{#SNMPINDEX}])<>2'
      - uuid: 04ef02e0aaf340e7b2846520f75e1de7
        name: 'Interface {#IFNAME}: Incoming discards'
        type: SNMP_AGENT
        key: fs.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
      - uuid: ab9814f1c8e849af9c46ba25c9b69186
        name: 'Interface {#IFNAME}: Incoming errors'
        type: SNMP_AGENT
        key: fs.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
        trigger_prototypes:
        - uuid: b090e3c3a488423e9bcac8cc68ddf1d1
          name: 'FS S5850C: Interface {#IFNAME}: Incoming errors'
          expression: min(/FS S5850C by SNMP/fs.if.in.errors[{#SNMPINDEX}],5m)>{$FS.IF.ERRORS.WARN}
          priority: WARNING
          tags:
          - tag: scope
            value: performance
      - uuid: 32ad0e3d4ddb413aa6fb68dbc7fd6bb0
        name: 'Interface {#IFNAME}: Outgoing discards'
        type: SNMP_AGENT
        key: fs.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
      - uuid: e37f2d4504a145abb14eb05e144dc875
        name: 'Interface {#IFNAME}: Outgoing errors'
        type: SNMP_AGENT
        key: fs.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: interface
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        description: Standard IF-MIB OID; not verified in the supplied ifX-only dump.
        trigger_prototypes:
        - uuid: 029743a55ce4461e8e8f124f36b48357
          name: 'FS S5850C: Interface {#IFNAME}: Outgoing errors'
          expression: min(/FS S5850C by SNMP/fs.if.out.errors[{#SNMPINDEX}],5m)>{$FS.IF.ERRORS.WARN}
          priority: WARNING
          tags:
          - tag: scope
            value: performance
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFNAME}'
          value: '{$FS.IF.NAME.MATCHES}'
          operator: MATCHES_REGEX
          formulaid: A
        - macro: '{#IFNAME}'
          value: '{$FS.IF.NAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
          formulaid: B
      status: DISABLED
      description: Not present in the supplied dumps. Verify 1.3.6.1.2.1.2.2.1, then enable this discovery rule. Link-down triggers require FS.IF.CONTROL=1
        for the relevant interface context.
    - uuid: 11d01523113a4f0ab7c0cea85ea42223
      name: Fan discovery
      type: SNMP_AGENT
      key: fs.fan.discovery
      snmp_oid: discovery[{#FANSTATUS},1.3.6.1.4.1.52642.1.37.1.1.1.1.4]
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      item_prototypes:
      - uuid: f0446e0e177d478a84185e90f64fd0d3
        name: 'Fan {#SNMPINDEX}: Status'
        type: SNMP_AGENT
        key: fs.fan.status[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: fan
        snmp_oid: get[1.3.6.1.4.1.52642.1.37.1.1.1.1.4.{#SNMPINDEX}]
        valuemap:
          name: FS active status
        trigger_prototypes:
        - uuid: c61cdc3f0cf048e69045819eaf418f96
          name: 'FS S5850C: Fan {#SNMPINDEX}: Inactive'
          expression: min(/FS S5850C by SNMP/fs.fan.status[{#SNMPINDEX}],3m)=2 and max(/FS S5850C by SNMP/fs.fan.status[{#SNMPINDEX}],3m)=2
          priority: HIGH
          tags:
          - tag: scope
            value: availability
      - uuid: b21cfcf8111f4331a0d6843ea2251afc
        name: 'Fan {#SNMPINDEX}: Reported speed'
        type: SNMP_AGENT
        key: fs.fan.speed[{#SNMPINDEX}]
        delay: 1m
        history: 14d
        trends: 365d
        tags:
        - tag: component
          value: fan
        snmp_oid: get[1.3.6.1.4.1.52642.1.37.1.1.1.1.5.{#SNMPINDEX}]
        value_type: FLOAT
        units: '%'
